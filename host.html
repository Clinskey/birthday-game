<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Game — Host</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Birthday Game · Host</h1><p>Private host controls · Open <b>/tv.html</b> on the Xbox browser.</p><div id="status" class="muted">Connecting…</div><div id="app"></div></main><script>
let state=null,dirty=false;const app=document.getElementById('app'),status=document.getElementById('status');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function action(type,payload={}){try{let r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,payload})}),j=await r.json();if(!r.ok)throw Error(j.error);dirty=false;await refresh(true);}catch(e){status.textContent=e.message;status.className='error';}}
async function refresh(force=false){try{let r=await fetch('/api/host-state',{cache:'no-store'}),s=await r.json();status.textContent='Connected · game automatically saved';status.className='muted';if(force||!state||(!dirty&&s.revision!==state.revision)){state=s;render();}}catch{status.textContent='Disconnected · retrying';status.className='error';}}
function render(){if(state.phase==='setup'){
 app.innerHTML=`<section><h2>Pregame setup</h2><p>Enter player names, one per line. Tick at least one mole on each team. Roles stay off the Xbox.</p><div class="teams">${state.teams.map((t,i)=>`<div class="team panel"><label>Team name<input id="name${i}" value="${esc(t.name)}"></label><label>Players (one per line)<textarea id="players${i}" rows="8" style="width:100%;background:#0d1220;color:white;border:1px solid #4c5671;padding:10px;border-radius:8px">${esc(t.players.join('\n'))}</textarea></label><div id="moles${i}">${t.players.map(p=>`<label class="small"><input type="checkbox" data-mole="${esc(p)}" ${state.moles.includes(p)?'checked':''}> Mole: ${esc(p)}</label>`).join('')}</div></div>`).join('')}</div><button id="save">Save setup / refresh mole choices</button><button id="start">Start Game</button></section>`;
 document.getElementById('save').onclick=()=>saveSetup();document.getElementById('start').onclick=async()=>{await saveSetup(true);};
 }else if(state.phase==='noise'){
 const i=state.index,score=state.scores[i];app.innerHTML=`<section><h2>Noise Boys</h2><p class="small">Host only · prompt ${i+1} of 18</p><h2>${esc(state.teams[i%3].name)}</h2><p>${esc(state.prompts[i])}</p><h2>Score this performance</h2><div class="score-buttons">${[0,1,2,3,4,5].map(n=>`<button class="${score===n?'':'secondary'}" data-score="${n}">${n}</button>`).join('')}</div><button id="next" ${score===null?'disabled':''}>${i===17?'Reveal Scores':'Next Prompt'}</button></section>`;
 document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>action('score',{score:Number(b.dataset.score)}));document.getElementById('next').onclick=()=>action(i===17?'reveal':'next');
 }else{app.innerHTML=`<section><h2>Noise Boys scores revealed</h2><p>Round complete. The full-game rounds will be added after this connection prototype is tested.</p></section>`;}}
async function saveSetup(start=false){const teams=state.teams.map((_,i)=>({name:document.getElementById('name'+i).value,players:document.getElementById('players'+i).value.split('\n').map(x=>x.trim()).filter(Boolean)}));const moles=[...document.querySelectorAll('[data-mole]:checked')].map(x=>x.dataset.mole);try{let r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'setup',payload:{teams,moles}})}),j=await r.json();if(!r.ok)throw Error(j.error);dirty=false;await refresh(true);if(start)await action('start');}catch(e){status.textContent=e.message;status.className='error';}}
setInterval(()=>refresh(),1200);refresh(true);
</script></body></html>
