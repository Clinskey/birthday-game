<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Game — Host</title><link rel="stylesheet" href="style.css"></head><body><main><h1>Birthday Game · Host</h1><div id="status">Connecting…</div><nav id="global"></nav><div id="app"></div></main><script>
let s=null,editing=false;const app=document.getElementById('app'),status=document.getElementById('status'),global=document.getElementById('global');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const btn=(label,type,p={},disabled=false)=>`<button ${disabled?'disabled':''} data-action="${esc(type)}" data-payload="${esc(JSON.stringify(p))}">${esc(label)}</button>`;
const card=(title,body)=>`<section><h2>${esc(title)}</h2>${body}</section>`;
const players=()=>s.teams.flatMap(t=>t.players);
const names=(key='player')=>s.teams.map((t,i)=>`<div class="team"><h3>${esc(t.name)}</h3>${t.players.map(p=>`<button class="secondary" data-${key}="${esc(p)}">${esc(p)} ${key==='violate'?`(${s.violationCounts[p]||0})`:''}</button>`).join('')}</div>`).join('');
async function send(type,p={}){try{const r=await fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type,payload:p})});const j=await r.json();if(!r.ok)throw Error(j.error);editing=false;await refresh(true);}catch(e){status.textContent='Error: '+e.message;status.className='error';}}
async function refresh(force=false){try{const r=await fetch('/api/host-state',{cache:'no-store'}),j=await r.json();status.textContent='Connected · autosaved';status.className='muted';if(force||!s||(!editing&&j.revision!==s.revision)){s=j;render();}}catch(e){status.textContent='Disconnected — retrying';status.className='error';}}
function bind(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>send(b.dataset.action,JSON.parse(b.dataset.payload||'{}')));}
function setup(){return card('Pregame setup',`<p>Enter player names, one per line. Save setup to choose moles. At least one mole per team.</p><div class="teams">${s.teams.map((t,i)=>`<div class="team"><label>Team name<input id="name${i}" value="${esc(t.name)}"></label><label>Players<textarea id="players${i}" rows="7">${esc(t.players.join('\n'))}</textarea></label>${t.players.map(p=>`<label class="small"><input type="checkbox" data-mole="${esc(p)}" ${s.moles.includes(p)?'checked':''}> Mole: ${esc(p)}</label>`).join('')}</div>`).join('')}</div><button id="saveSetup">Save setup</button>${btn('Start Game','start')}`);}
function noise(){const score=s.noise[s.ni];return card('Noise Boys',`<p>Prompt ${s.ni+1}/18 · ${esc(s.teams[s.ni%3].name)}</p><p class="question">${esc(s.prompts[s.ni])}</p><div class="score-buttons">${[0,1,2,3,4,5].map(n=>`<button class="${score===n?'':'secondary'}" data-score="${n}">${n}</button>`).join('')}</div>${btn(s.ni===17?'Reveal Scores':'Next Prompt',s.ni===17?'noiseReveal':'noiseNext',{},score===null)}`);}
function trivia(){let body=`<p><b>Current team:</b> ${esc(s.teams[s.turn].name)}</p>`;
if(s.triviaView==='board'){body+=`<div class="board">${s.board.map(id=>{const q=s.questions.find(q=>q.id===id);return `<button class="tile" data-q="${q.id}">${esc(q.pool)}<br>${esc(q.category)}<br><b>${esc(q.difficulty)}</b></button>`}).join('')}</div>${btn('Next Turn','nextTurn')}<p class="small">Select a tile to display the question on Xbox.</p>`;}
if(s.triviaView==='question'){const q=s.questions.find(q=>q.id===s.activeQuestion);body+=`<p class="question">${esc(q.text)}</p>`;if(q.type==='allplay'){body+=`<p>Choose the last surviving team:</p>${s.teams.map((t,i)=>btn(t.name+' wins','allPlay',{winner:i})).join('')}`;}else{body+=`<label>Points (0–5 in half points)<select id="gradeScore">${Array.from({length:11},(_,i)=>`<option value="${i/2}">${i/2}</option>`).join('')}</select></label>${q.bonus?'<label><input type="checkbox" id="bonus"> Award +3 legal-name bonus</label>':''}<p>Right enough to continue?</p><button id="gradeYes">Yes — Bingo ball</button><button id="gradeNo" class="secondary">No — Roullette</button>`;}}
if(s.triviaView==='draw')body+=`<p>New draw is visible on Xbox.</p>${btn('Continue','drawContinue')}`;
if(s.triviaView==='ended')body+=`<p>Trivia Bingo ended. Scores remain hidden.</p>${btn('Reveal Scores','triviaReveal')}`;
if(s.triviaView==='scores')body+=`<p>Scores are visible on Xbox.</p>${btn('Begin Mole Hunt Part One','beginMole1')}`;
if(!s.triviaEnded)body+=`<details><summary>End Trivia Bingo (any time)</summary><p>Choose how the round ends:</p><select id="bingoWinner"><option value="none">End without Bingo</option>${s.teams.map((t,i)=>`<option value="${i}">Bingo winner: ${esc(t.name)}</option>`).join('')}</select><button id="endTrivia">Confirm End Trivia Bingo</button></details>`;
body+=`<details id="violations"><summary>Record Roullette violation</summary><p>Tap a player. Panel stays open; penalties are silent on TV.</p><div class="teams">${names('violate')}</div></details>`;
return card('Trivia Bingo',body);}
function mole1(){let body=`<p>Accusations are announced verbally. The game checks secret roles automatically.</p>`;if(s.moleView==='waiting'){if(s.accusationTeam<3){const t=s.teams[s.accusationTeam];body+=`<h3>Accusing team: ${esc(t.name)}</h3>${t.players.filter(p=>!s.accusations.some(a=>a.player===p)).map(p=>btn('Accuse '+p,'accuse',{player:p})).join('')}${btn('Stop accusing — Next team','accuseNextTeam')}`;}else body+='<p>All teams finished accusing.</p>';body+=btn('Reveal Entire Mole Team','moleReveal');}else body+=`<p>All moles and combined Mole Team score are on Xbox.</p>${btn('Begin Bowl of Nouns','beginBowl')}`;return card('Mole Hunt Part One',body);}
function bowl(){let body=`<p><b>Active:</b> ${esc(s.bowlTurn===3?'Mole Team':s.teams[s.bowlTurn].name)} · Pass ${s.bowlPass+1}/3 · ${s.bowlRemaining.length} clues remain</p>`;
body+=`<h2>${Math.ceil(s.bowlTime)} seconds</h2>`;
if(s.bowlCurrent!==null)body+=`<div class="clue">${esc(s.bowlClues[s.bowlCurrent])}</div>`;
if(s.bowlView==='waiting')body+=btn('Start — Reveal Clue + Timer','bowlStart');
if(s.bowlView==='playing')body+=btn('Correct (+1 and next clue)','bowlCorrect');
if(s.bowlView==='expired')body+=`${btn('Correct at buzzer (+1)','bowlCorrect')}${btn('Failed — Return to bowl','bowlFailed')}`;
if(s.bowlView==='refill')body+=`<p>Bowl empty! Clock frozen. Refilled for pass ${s.bowlPass+1}.</p>${btn('Resume — Reveal next clue','bowlRefill')}`;
if(s.bowlView==='finished')body+=`<p>All three passes complete.</p>${btn('Show Scores','bowlShowScores')}`;
if(s.bowlView==='scores')body+=btn('Begin Mole Hunt Part Two','beginMole2');
return card('Bowl of Nouns',body);}
function mole2(){let body='<p>Accusation and discussion are verbal. Record the Mole Team’s one accusation here.</p>';
if(s.part2View==='waiting'){body+=`<select id="moleAccused"><option value="">Select accused mole</option>${s.moles.map(m=>`<option value="${esc(m)}" ${s.part2Accused===m?'selected':''}>${esc(m)}</option>`).join('')}</select><button id="recordAccused">Record Accusation</button>${btn('Reveal Bomb Diggity Whack-a-Moles','part2Reveal',{},!s.part2Accused)}`;}
if(s.part2View==='twist')body+=btn('Show Updated Scores','part2Scores');
if(s.part2View==='scores')body+=btn('Begin Bonus Stars','beginStars');
return card('Mole Hunt Part Two',body);}
function stars(){const star=['Traveler','Rulebreaker','Fashionable'][s.starIndex];if(!star)return card('Final Reveal',btn('Reveal Final Scores — Lock Scoring','finalReveal'));
return card('Bonus Star: '+star,`<p>Choose all tied winners. Each selected player earns +10 for the original team.</p><div class="teams">${s.teams.map(t=>`<div class="team"><h3>${esc(t.name)}</h3>${t.players.map(p=>`<label><input type="checkbox" data-star="${esc(p)}"> ${esc(p)}${star==='Rulebreaker'?` (${s.violationCounts[p]||0})`:''}</label>`).join('')}</div>`).join('')}</div><button id="awardStar">Award ${esc(star)} Star</button>`);}
function final(){const distinct=[...new Set(s.hostScores.slice(0,3).map(t=>t.score))].length;return card('Final Standings',`<p>Scoring locked. Reveal ${s.finalReveal} of ${distinct} distinct score levels.</p>${btn('Reveal Next Place','finalNext',{},s.finalReveal>=distinct)}`);}
function render(){global.innerHTML=s.phase!=='final'&&s.phase!=='setup'?`${btn('Undo','undo',{},!s.undoCount)}${btn('Redo','redo',{},!s.redoCount)}${btn(s.paused?'Resume Game':'Pause Game',s.paused?'resume':'pause')}`:'';let body='';switch(s.phase){case 'setup':body=setup();break;case 'noise':body=noise();break;case 'noiseScores':body=card('Noise Boys Complete',btn('Begin Trivia Bingo','beginTrivia'));break;case 'trivia':body=trivia();break;case 'mole1':body=mole1();break;case 'bowl':body=bowl();break;case 'mole2':body=mole2();break;case 'stars':body=stars();break;case 'final':body=final();break;}
if(['setup','noise','noiseScores','trivia','mole1'].includes(s.phase))body+=`<details><summary>Bowl of Nouns clue bank (${s.bowlClues.length})</summary><input id="newClue" placeholder="Add clue"><button id="addClue">Add Clue</button>${s.bowlClues.map((c,i)=>`<div class="small">${esc(c)} <button class="secondary" data-delete="${i}">Delete</button></div>`).join('')}</details>`;
if(s.phase!=='final')body+=`<details><summary>Emergency reset</summary><p>Resets ALL game progress.</p><button id="reset" class="danger">Reset Entire Game</button></details>`;
app.innerHTML=body;bind();wire();}
function wire(){document.querySelectorAll('input,textarea,select').forEach(x=>x.addEventListener('input',()=>{if(s.phase==='setup')editing=true;}));
const id=x=>document.getElementById(x);
if(id('saveSetup'))id('saveSetup').onclick=()=>{const teams=s.teams.map((_,i)=>({name:id('name'+i).value,players:id('players'+i).value.split('\n').map(x=>x.trim()).filter(Boolean)}));send('setup',{teams,moles:[...document.querySelectorAll('[data-mole]:checked')].map(x=>x.dataset.mole)});};
document.querySelectorAll('[data-score]').forEach(b=>b.onclick=()=>send('noiseScore',{score:Number(b.dataset.score)}));
document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>send('chooseQuestion',{id:b.dataset.q}));
for(const [name,enough] of [['gradeYes',true],['gradeNo',false]])if(id(name))id(name).onclick=()=>send('grade',{score:Number(id('gradeScore').value),enough,bonus:!!id('bonus')?.checked});
if(id('endTrivia'))id('endTrivia').onclick=()=>{const x=id('bingoWinner').value;if(confirm('End Trivia Bingo now?'))send('endTrivia',{winner:x==='none'?null:Number(x)});};
document.querySelectorAll('[data-violate]').forEach(b=>b.onclick=()=>{const panel=id('violations');send('violation',{player:b.dataset.violate}).then(()=>{if(id('violations'))id('violations').open=true;});});
if(id('recordAccused'))id('recordAccused').onclick=()=>send('part2Accuse',{player:id('moleAccused').value});
if(id('awardStar'))id('awardStar').onclick=()=>send('awardStar',{players:[...document.querySelectorAll('[data-star]:checked')].map(x=>x.dataset.star)});
if(id('addClue'))id('addClue').onclick=()=>send('addClue',{text:id('newClue').value});
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>send('editClue',{index:Number(b.dataset.delete),text:null}));
if(id('reset'))id('reset').onclick=()=>{if(prompt('Type RESET to erase the game')==='RESET')send('reset',{confirm:'RESET'});};}
setInterval(()=>{if(s&&s.phase==='bowl')fetch('/api/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'heartbeat'})}).catch(()=>{});refresh();},1000);refresh(true);
</script></body></html>
