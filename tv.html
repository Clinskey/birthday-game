<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Game — TV</title><link rel="stylesheet" href="style.css"></head><body><main class="tv"><div id="app" class="screen"><h1>Connecting…</h1></div></main><script>
let rev=-1,prevIndex=-1;const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function cue(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.setValueAtTime(560,c.currentTime);o.frequency.exponentialRampToValueAtTime(900,c.currentTime+.13);g.gain.setValueAtTime(.09,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.2);o.start();o.stop(c.currentTime+.2);}catch{}}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'}),s=await r.json();if(s.revision===rev)return;rev=s.revision;if(s.phase==='setup')app.innerHTML=`<h1>Birthday Game</h1><div class="teams">${s.teams.map(t=>`<section class="team"><h2>${esc(t.name)}</h2>${t.players.map(p=>`<div>${esc(p)}</div>`).join('')}</section>`).join('')}</div>`;else if(s.phase==='noise'){app.innerHTML=`<h1>${esc(s.activeTeam)}</h1><div class="prompt">${esc(s.prompt)}</div>`;if(prevIndex!==s.index){cue();prevIndex=s.index;}}else app.innerHTML=`<h1>Noise Boys</h1><div class="teams">${s.scoreboard.map(t=>`<section class="team"><h2>${esc(t.name)}</h2><div class="score">${t.score}</div></section>`).join('')}</div>`;}catch{/* preserve last display during network issues */}}
setInterval(poll,800);poll();
</script></body></html>
