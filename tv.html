<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Birthday Game — TV</title><link rel="stylesheet" href="style.css"></head><body><main class="tv"><div id="app"><h1>Connecting…</h1></div></main><script>
let s=null,rev=-1,lastNoise=-1,lastBowlView='',soundEnabled=false;const app=document.getElementById('app');
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function beep(buzzer=false){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type=buzzer?'sawtooth':'sine';o.frequency.value=buzzer?230:660;g.gain.value=.09;o.start();setTimeout(()=>{o.stop();c.close()},buzzer?850:180);}catch{}}
const board=t=>`<div class="teams">${t.map(x=>`<section class="team"><h2>${esc(x.name)}</h2><div class="score">${esc(x.score)}</div></section>`).join('')}</div>`;
function show(){if(!s)return;let h='';if(s.phase==='setup')h=`<h1>Birthday Game</h1><div class="teams">${s.teams.map(t=>`<section class="team"><h2>${esc(t.name)}</h2>${t.players.map(p=>`<div>${esc(p)}</div>`).join('')}</section>`).join('')}</div>`;
if(s.phase==='noise')h=`<h1>${esc(s.activeTeam)}</h1><div class="prompt">${esc(s.prompt)}</div>`;
if(s.phase==='noiseScores')h=`<h1>Noise Boys Scores</h1>${board(s.scoreboard)}`;
if(s.phase==='trivia'){if(s.view==='board')h=`<h1>Trivia Bingo</h1><div class="board">${s.board.map(q=>`<div class="tile"><b>${esc(q.pool==='Lore'?'Colm Lore':'Colm Knowledge')}</b><br>${esc(q.category)}<br><strong>${esc(q.difficulty)}</strong></div>`).join('')}</div>`;
if(s.view==='question')h=`<div class="prompt">${esc(s.question?.text)}</div>${s.question?.image?`<img class="question-image" src="${{tiers:'tiers.jpeg',pink:'pink.jpeg',yellow:'yellow.png'}[s.question.image]}">`:''}`;
if(s.view==='draw'){const d=s.draw;if(d.kind==='ball')h=`<h1>Bingo Ball</h1><div class="ball">${esc(d.value)}</div>`;if(d.kind==='rule')h=`<h1>Roullette</h1><div class="prompt">${esc(d.value)}</div>`;if(d.kind==='allplay')h=`<h1>Roullette</h1>${d.value.map(x=>`<section><h2>${esc(x.team)}</h2><p class="prompt">${esc(x.rule)}</p></section>`).join('')}`;}
if(s.view==='ended')h=`<h1>Trivia Bingo</h1><p>Round complete</p>`;
if(s.view==='scores')h=`<h1>Trivia Bingo Scores</h1>${board(s.scoreboard)}`;}
if(s.phase==='mole1')h=s.view==='reveal'?`<h1>The Mole Team</h1><div class="roster">${s.roster.map(x=>`<div>${esc(x)}</div>`).join('')}</div><div class="score">${s.scoreboard[3].score} points</div>`:`<h1>Mole Hunt</h1>`;
if(s.phase==='bowl')h=`<h1>${esc(s.activeTeam)}</h1><div id="countdown" class="countdown">${Math.ceil(s.seconds)}</div>${s.view==='scores'?`<h2>Bowl of Nouns Scores</h2>`:''}${board(s.scoreboard)}${s.paused?'<p>PAUSED</p>':''}`;
if(s.phase==='mole2')h=s.view==='twist'?`<h1>Bomb Diggity Whack-a-Moles</h1><div class="prompt">EVERY MOLE WAS A BOMB DIGGITY WHACK-A-MOLE!</div>`:s.view==='scores'?`<h1>Updated Scores</h1>${board(s.scoreboard)}`:`<h1>Mole Hunt</h1>${board(s.scoreboard||[])}`;
if(s.phase==='stars')h=`<h1>Bonus Star</h1><div class="prompt">${esc(s.star)}</div>`;
if(s.phase==='final'){const distinct=[...new Set(s.scoreboard.map(x=>x.score))].sort((a,b)=>a-b);const revealed=distinct.slice(0,s.reveal);h=`<h1>Final Standings</h1>${board(s.scoreboard.filter(x=>revealed.includes(x.score)).sort((a,b)=>a.score-b.score))}${s.reveal>=distinct.length?'<h1>WINNER!</h1>':''}`;}
app.innerHTML=h;}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'}),j=await r.json();if(j.revision===rev)return;const old=s;rev=j.revision;s=j;show();if(s.phase==='noise'&&lastNoise!==s.ni){beep();lastNoise=s.ni;}if(s.phase==='bowl'&&s.view==='expired'&&lastBowlView!=='expired')beep(true);lastBowlView=s.phase==='bowl'?s.view:'';}catch{/* Keep current display if offline */}}
setInterval(()=>{if(s?.phase==='bowl'&&s.running&&!s.paused){const el=document.getElementById('countdown');if(el)el.textContent=Math.ceil(Math.max(0,s.seconds-(Date.now()-s.lastTick)/1000));}},100);
setInterval(poll,700);poll();
</script></body></html>
